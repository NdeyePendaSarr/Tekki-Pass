# Local stack: `docker compose up --build`
#   web -> http://localhost:3000
#   api -> http://localhost:8000/health (API docs: /docs)
#   relay -> ws://localhost:7777 (local Nostr relay)
# Values come from `.env` (copy `.env.example`); the defaults below are for local development only.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tekki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-tekki_pass}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      NETWORK: ${NETWORK:-testnet}
      DATABASE_URL: postgresql://${POSTGRES_USER:-tekki}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-tekki_pass}
      # Local demo: fake Lightning payments, attestations published to the local relay only.
      LIGHTNING_BACKEND: fake
      NOSTR_RELAYS: '["ws://relay:8080"]'
      NOSTR_MIN_RELAY_ACKS: 1
      # Browsers cannot reach ws://relay:8080: the verification page reads the published port.
      PUBLIC_RELAYS: '["ws://localhost:${RELAY_PORT:-7777}"]'
      # Secrets come only from .env. When unset, throwaway values are generated at startup.
      DEV_GENERATE_MISSING_SECRETS: "true"
      # Artisan auth (NIP-98) is required (default). The browser signs the URL it calls:
      # the web proxy on the published web port, or the API directly.
      NIP98_URL_PREFIXES: '["http://localhost:${WEB_PORT:-3000}/api","http://localhost:${API_PORT:-8000}"]'
      NOSTR_ISSUER_NSEC: ${NOSTR_ISSUER_NSEC:-}
      CLIENT_PHONE_PEPPER: ${CLIENT_PHONE_PEPPER:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      relay:
        condition: service_started

  # Local Nostr relay (never a public one in development). ws://localhost:7777 from the host.
  relay:
    image: scsibug/nostr-rs-relay:0.10.0
    ports:
      - "${RELAY_PORT:-7777}:8080"

  web:
    build: ./apps/web
    environment:
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
