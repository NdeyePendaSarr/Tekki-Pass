name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security issue? Do **not** open a public issue: see SECURITY.md.
        Never paste real keys, recovery phrases or phone numbers here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Web app, API, Lightning wallet, Nostr attestation, Docker / CI, Other]
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options: [testnet, mainnet, not relevant]
  - type: input
    id: device
    attributes:
      label: Device / browser
      placeholder: e.g. Android 12, Chrome, 3G
