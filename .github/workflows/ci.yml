name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs only need to read the code.
permissions:
  contents: read

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (ruff, mypy, pytest, pip-audit)
    runs-on: ubuntu-latest
    # Local relay so publication is tested for real, without touching public relays.
    services:
      relay:
        image: scsibug/nostr-rs-relay:0.10.0
        ports:
          - 8080:8080
    env:
      NOSTR_TEST_RELAY_URL: ws://localhost:8080
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no floating major tag: pin the exact release commit.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.5"
          python-version: "3.12"
          working-directory: apps/api
      - name: Install dependencies (locked)
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run --frozen ruff check .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Mypy (strict)
        run: uv run --frozen mypy
      - name: Pytest
        run: uv run --frozen pytest
      - name: pip-audit (known vulnerabilities)
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run --frozen pip-audit --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  web:
    name: Web (ESLint, Prettier, tsc, Vitest, npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm test
      # Shipped code: fail on high. Dev-only tools (Vite, Vitest, ESLint) never reach users
      # and sometimes wait days for an upstream fix: fail on critical only.
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (all dependencies)
        run: npm audit --audit-level=critical

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build all images
        run: docker compose build

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history, not only the last commit
      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $archive\$" checksums.txt | sha256sum --check -
          tar -xzf "$archive" gitleaks
      - name: Scan
        run: ./gitleaks git --redact --verbose .

  commitlint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint PR commits
        if: github.event_name == 'pull_request'
        run: >
          npx commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
      - name: Lint pushed commit
        if: github.event_name == 'push'
        run: npx commitlint --verbose --last
