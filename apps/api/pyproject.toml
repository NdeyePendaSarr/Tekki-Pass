[project]
name = "tekki-pass-api"
version = "0.1.0"
description = "Tekki-Pass API: orchestrates attestation requests, Lightning payment proofs and Nostr publication."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
]

[dependency-groups]
dev = [
  # HTTP client used by FastAPI's TestClient (successor of httpx, recommended by Starlette).
  "httpx2>=2.16,<3",
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.8,<1",
]

[tool.uv]
# This is an application, not a library: no build backend needed.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle + pyflakes
  "I",            # import sorting
  "B",            # bugbear
  "UP",           # pyupgrade
  "N",            # naming
  "S",            # bandit (security)
  "ANN",          # type annotations required
  "SIM",          # simplifications
  "RUF",          # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
