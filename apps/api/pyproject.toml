[project]
name = "tekki-pass-api"
version = "0.1.0"
description = "Tekki-Pass API: orchestrates attestation requests, Lightning payment proofs and Nostr publication."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic-settings>=2.6,<3",
  # rust-nostr bindings: event signing and verification (no home-made crypto). 0.x API moves fast.
  "nostr-sdk>=0.45.1,<0.46",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",  # PostgreSQL driver (Docker, production)
  "aiosqlite>=0.20,<1",  # SQLite driver (local runs without Docker, tests)
  # HTTP client: LNURL-pay and LUD-21 calls to the artisan's Lightning address. Also used
  # by FastAPI's TestClient (successor of httpx, recommended by Starlette).
  "httpx2>=2.16,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pip-audit>=2.7,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.8,<1",
]

[tool.uv]
# This is an application, not a library: no build backend needed.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle + pyflakes
  "I",            # import sorting
  "B",            # bugbear
  "UP",           # pyupgrade
  "N",            # naming
  "S",            # bandit (security)
  "ANN",          # type annotations required
  "SIM",          # simplifications
  "RUF",          # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[[tool.mypy.overrides]]
# nostr-sdk ships no type information; it is only imported by app/attestations/nostr.py,
# which exposes a fully typed API to the rest of the code.
module = ["nostr_sdk"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
